name: release

# Builds the release files (installer Setup.exe, portable .zip, SHA256SUMS.txt), proves the installer on the runner by installing,
# upgrading, downgrading and uninstalling it for real, and - only for a version tag - leaves a DRAFT release with the files attached.
#
# A release starts in one of two ways, and either way it ends as a DRAFT the owner publishes by hand on GitHub:
# - pushing a tag `vX.Y.Z`;
# - a manual run (workflow_dispatch) with `draft_release` ticked: the draft names the tag `vX.Y.Z` on the commit that was built, and
#   GitHub creates that tag when the draft is published. This is the way when no one can push a tag (an agent's cloud session cannot).
# Nothing here publishes a release by itself, and an agent starts a release only when the owner says so (CLAUDE.md, Deploy). A manual
# run without `draft_release` builds and verifies the same files and keeps them as a workflow artifact, without touching releases.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, x.y.z (a trial: no release is created)'
        required: true
        default: '0.0.1'
      draft_release:
        description: 'Also leave a DRAFT release vX.Y.Z of the built commit (the tag is created when the draft is published)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $version = '${{ inputs.version }}' }
          else { $version = '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "The version must be x.y.z (tag vX.Y.Z), got '$version'" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "Building version $version"

      - name: Build (Release, warnings are errors)
        run: dotnet build Paper.ScreenWizzard.slnx -c Release --nologo -v minimal

      - name: Unit tests
        run: dotnet test tests/Paper.ScreenWizzard.UnitTests -c Release --no-build --nologo -v minimal

      - name: Package (Setup.exe, .zip, SHA256SUMS.txt)
        shell: pwsh
        run: ./installer/build-package.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Prove the installer (install, run, upgrade, downgrade, repair, uninstall)
        shell: pwsh
        run: ./installer/verify-installer.ps1 -Setup 'artifacts/Paper.ScreenWizzard-${{ steps.version.outputs.version }}-win-x64-Setup.exe'

      - uses: actions/upload-artifact@v4
        with:
          name: Paper.ScreenWizzard-${{ steps.version.outputs.version }}
          path: |
            artifacts/Paper.ScreenWizzard-${{ steps.version.outputs.version }}-win-x64-Setup.exe
            artifacts/Paper.ScreenWizzard-${{ steps.version.outputs.version }}-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Draft release (a tag, or a manual run with draft_release)
        if: github.event_name == 'push' || inputs.draft_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v${{ steps.version.outputs.version }}'
          # A draft made by a manual run is published by hand, which creates the tag, which runs this workflow again: that second run
          # finds the release already there and leaves it alone.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            if ('${{ github.event_name }}' -eq 'push') { "The release $tag already exists: nothing to draft."; exit 0 }
            throw "The release $tag already exists: choose another version."
          }
          gh release create $tag --draft --generate-notes --target '${{ github.sha }}' --title 'Paper.ScreenWizzard ${{ steps.version.outputs.version }}' `
            'artifacts/Paper.ScreenWizzard-${{ steps.version.outputs.version }}-win-x64-Setup.exe' `
            'artifacts/Paper.ScreenWizzard-${{ steps.version.outputs.version }}-win-x64.zip' `
            'artifacts/SHA256SUMS.txt'
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed ($LASTEXITCODE)" }
